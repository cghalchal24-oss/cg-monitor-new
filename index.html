<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CG Smart Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f4f6fa; color:#1e293b; padding:20px; transition:background 0.3s; }
        body.dark { background:#0f172a; color:#e2e8f0; }
        .container { max-width:1440px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom:30px; }
        .logo { display:flex; align-items:center; gap:12px; }
        .logo i { font-size:2.2rem; color:#2563eb; background:rgba(37,99,235,0.12); padding:12px; border-radius:16px; }
        .logo h1 { font-size:1.8rem; font-weight:800; }
        .logo span { color:#2563eb; }
        .scan-btn { background:#2563eb; border:none; color:#fff; padding:10px 24px; border-radius:60px; font-weight:600; display:flex; align-items:center; gap:10px; cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,0.3); }
        .scan-btn:disabled { opacity:0.6; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:18px; margin-bottom:28px; }
        .stat-card { background:#fff; border-radius:20px; padding:16px 20px; border:1px solid rgba(0,0,0,0.04); }
        body.dark .stat-card { background:#1e293b; border-color:#334155; }
        .stat-card .label { font-size:0.8rem; color:#64748b; text-transform:uppercase; }
        .stat-card .value { font-size:2rem; font-weight:700; }
        .main-grid { display:grid; grid-template-columns:1fr 340px; gap:25px; margin-bottom:30px; }
        @media (max-width:900px) { .main-grid { grid-template-columns:1fr; } }
        .updates-feed { background:#fff; border-radius:24px; padding:20px 22px; border:1px solid rgba(0,0,0,0.04); }
        body.dark .updates-feed { background:#1e293b; border-color:#334155; }
        .feed-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .badge { background:#dc2626; color:#fff; border-radius:40px; padding:2px 14px; font-size:0.75rem; font-weight:600; }
        .update-item { display:flex; align-items:flex-start; gap:14px; padding:12px 0; border-bottom:1px solid #f1f5f9; }
        body.dark .update-item { border-bottom-color:#334155; }
        .update-icon { font-size:1.5rem; min-width:32px; text-align:center; }
        .update-content { flex:1; }
        .update-title { font-weight:600; font-size:0.95rem; }
        .update-meta { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:0.8rem; color:#64748b; }
        body.dark .update-meta { color:#94a3b8; }
        .update-tag { background:#e2e8f0; padding:2px 12px; border-radius:40px; font-size:0.65rem; font-weight:600; color:#1e293b; }
        body.dark .update-tag { background:#334155; color:#e2e8f0; }
        .update-pdf { margin-top:6px; color:#2563eb; cursor:pointer; font-size:0.75rem; }
        .sidebar { display:flex; flex-direction:column; gap:20px; }
        .dept-card { background:#fff; border-radius:24px; padding:16px 18px; border:1px solid rgba(0,0,0,0.04); }
        body.dark .dept-card { background:#1e293b; border-color:#334155; }
        .dept-list { display:flex; flex-wrap:wrap; gap:5px; max-height:260px; overflow-y:auto; }
        .dept-tag { background:#f1f5f9; padding:3px 12px; border-radius:40px; font-size:0.7rem; font-weight:500; color:#1e293b; }
        body.dark .dept-tag { background:#2d3a4f; color:#e2e8f0; }
        .pdf-log { background:#fff; border-radius:24px; padding:16px 18px; border:1px solid rgba(0,0,0,0.04); }
        body.dark .pdf-log { background:#1e293b; border-color:#334155; }
        .pdf-entry { background:#f8fafc; padding:8px 14px; border-radius:14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; cursor:pointer; }
        body.dark .pdf-entry { background:#0f172a; }
        .pdf-entry .filename { flex:1; }
        .pdf-entry .status { font-size:0.65rem; background:#dbeafe; padding:2px 12px; border-radius:40px; }
        .history-panel { background:#fff; border-radius:24px; padding:16px 18px; border:1px solid rgba(0,0,0,0.04); margin-top:20px; }
        body.dark .history-panel { background:#1e293b; border-color:#334155; }
        .history-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f1f5f9; font-size:0.85rem; }
        .footer { margin-top:30px; text-align:center; font-size:0.85rem; color:#94a3b8; border-top:1px solid #e2e8f0; padding-top:20px; }
        .toast { position:fixed; bottom:30px; right:30px; background:#1e293b; color:#fff; padding:14px 24px; border-radius:60px; transform:translateY(100px); opacity:0; transition:0.4s; z-index:999; }
        .toast.show { transform:translateY(0); opacity:1; }
        .toast i { color:#4ade80; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><i class="fas fa-microchip"></i><h1>CG <span>Smart Monitor</span></h1></div>
        <button class="scan-btn" id="scanBtn"><i class="fas fa-sync-alt"></i> Scan Now</button>
    </div>
    <div class="stats-grid">
        <div class="stat-card"><div class="label">Last Scan</div><div class="value" id="lastScan">--</div></div>
        <div class="stat-card"><div class="label">Status</div><div class="value" id="status">🔍 Ready</div></div>
        <div class="stat-card"><div class="label">Updates</div><div class="value" id="updatesCount">0</div></div>
        <div class="stat-card"><div class="label">Departments</div><div class="value">283+</div></div>
    </div>
    <div class="main-grid">
        <div class="updates-feed"><div class="feed-header"><h2><i class="fas fa-bolt" style="color:#eab308;"></i> Live Updates</h2><span class="badge" id="badge">0</span></div><div id="updatesList"><div style="text-align:center;padding:30px 0;color:#94a3b8;">Press "Scan Now"</div></div></div>
        <div class="sidebar">
            <div class="dept-card"><h3>📂 Departments <small>283+</small></h3><div class="dept-list" id="deptList"></div></div>
            <div class="pdf-log"><h3><i class="fas fa-file-pdf"></i> PDF Log</h3><div id="pdfLog"><div style="color:#94a3b8;font-size:0.8rem;">No PDFs</div></div></div>
        </div>
    </div>
    <div class="history-panel"><h3><i class="fas fa-history"></i> History</h3><div id="historyList"><div style="color:#94a3b8;font-size:0.8rem;">No history</div></div></div>
    <div class="footer"><i class="fas fa-robot"></i> Direct Scraping from Browser • No Backend Needed • 7 Core Sites</div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
    (function() {
        // ---------- DEPARTMENTS (Static) ----------
        const districts = ["Balod","Baloda Bazar","Balrampur","Bastar","Bemetara","Bijapur","Bilaspur","Dantewada","Dhamtari","Durg","Gariaband","Janjgir-Champa","Jashpur","Kabirdham","Kanker","Kondagaon","Korba","Koriya","Mahasamund","Mungeli","Narayanpur","Raigarh","Raipur","Rajnandgaon","Sukma","Surajpur","Surguja"];
        const depts = ["CG Vyapam","CGPSC","NHM CG","High Court","CG Police","CG Forest","CSEB"];
        const allDepts = [...districts, ...depts];
        const deptList = document.getElementById('deptList');
        deptList.innerHTML = allDepts.slice(0,100).map(d => `<span class="dept-tag">${d}</span>`).join('') + `<span class="dept-tag" style="background:#2563eb;color:#fff;">+${allDepts.length-100}</span>`;

        // ---------- STATE ----------
        let updates = [];
        let pdfs = [];
        let history = [];
        let isScanning = false;

        const updatesList = document.getElementById('updatesList');
        const pdfLog = document.getElementById('pdfLog');
        const historyList = document.getElementById('historyList');
        const lastScan = document.getElementById('lastScan');
        const status = document.getElementById('status');
        const updatesCount = document.getElementById('updatesCount');
        const badge = document.getElementById('badge');
        const scanBtn = document.getElementById('scanBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // ---------- RENDER ----------
        function render() {
            if (updates.length === 0) {
                updatesList.innerHTML = `<div style="text-align:center;padding:30px 0;color:#94a3b8;">No updates</div>`;
                badge.textContent = '0';
                updatesCount.textContent = '0';
            } else {
                let html = '';
                updates.forEach(u => {
                    html += `<div class="update-item">
                        <div class="update-icon">${u.icon}</div>
                        <div class="update-content">
                            <div class="update-title">${u.title}</div>
                            <div class="update-meta">
                                <span><i class="fas fa-building"></i> ${u.dept}</span>
                                <span><i class="far fa-clock"></i> ${u.time}</span>
                                <span class="update-tag">${u.type}</span>
                            </div>
                            ${u.pdf ? `<div class="update-pdf" onclick="window.open('${u.pdf}','_blank')"><i class="fas fa-file-pdf"></i> Download PDF</div>` : ''}
                        </div>
                    </div>`;
                });
                updatesList.innerHTML = html;
                badge.textContent = updates.length;
                updatesCount.textContent = updates.length;
            }

            if (pdfs.length === 0) {
                pdfLog.innerHTML = `<div style="color:#94a3b8;font-size:0.8rem;">No PDFs</div>`;
            } else {
                pdfLog.innerHTML = pdfs.map(p => `<div class="pdf-entry" onclick="window.open('${p.url}','_blank')">
                    <i class="fas fa-file-pdf"></i><span class="filename">${p.filename}</span><span class="status">${p.status}</span>
                </div>`).join('');
            }

            if (history.length === 0) {
                historyList.innerHTML = `<div style="color:#94a3b8;font-size:0.8rem;">No history</div>`;
            } else {
                historyList.innerHTML = history.slice(0,10).map(h => `<div class="history-item"><span>${h.time}</span><span>${h.desc}</span><span style="background:#e2e8f0;padding:0 10px;border-radius:40px;font-size:0.7rem;">${h.type}</span></div>`).join('');
            }
        }

        // ---------- SCRAPER (Direct from Browser) ----------
        async function scrapeWebsite(site) {
            try {
                const resp = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(site.url)}`);
                const data = await resp.json();
                const html = data.contents;
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = doc.querySelectorAll('a');
                const found = [];
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    const text = a.textContent.trim();
                    if (href && text && text.length > 3) {
                        const lower = text.toLowerCase();
                        if (lower.includes('pdf') || lower.includes('notice') || lower.includes('result') || 
                            lower.includes('recruitment') || lower.includes('tender') || lower.includes('admit') ||
                            lower.includes('answer') || lower.includes('merit') || lower.includes('vacancy')) {
                            let fullUrl = href;
                            if (!href.startsWith('http')) fullUrl = site.url + (site.url.endsWith('/') ? '' : '/') + href;
                            found.push({ href: fullUrl, text: text.substring(0,80) });
                        }
                    }
                });
                const updates = found.slice(0,5).map(link => {
                    let type = '🔴 Notification';
                    const lower = link.text.toLowerCase();
                    if (lower.includes('admit card') || lower.includes('hall ticket')) type = '🟢 Admit Card';
                    else if (lower.includes('result')) type = '🔵 Result';
                    else if (lower.includes('answer key')) type = '🟡 Answer Key';
                    else if (lower.includes('merit list')) type = '🟣 Merit List';
                    else if (lower.includes('tender')) type = '⚫ Tender';
                    else if (lower.includes('recruitment') || lower.includes('vacancy')) type = '🟠 Recruitment';
                    return { dept: site.name, icon: type.split(' ')[0], title: link.text, time: 'just now', type: type, pdf: link.href.includes('.pdf') ? link.href : null };
                });
                const pdfs = found.filter(l => l.href.includes('.pdf')).slice(0,3).map(l => ({ filename: l.href.split('/').pop() || 'document.pdf', status: 'Detected', url: l.href }));
                return { updates, pdfs };
            } catch(e) {
                return { updates: [], pdfs: [] };
            }
        }

        async function runScan() {
            if (isScanning) return;
            isScanning = true;
            scanBtn.disabled = true;
            scanBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Scanning...`;
            status.textContent = '⏳ Scanning...';

            const sites = [
                { name: 'CG Vyapam', url: 'https://cgvyapam.choice.gov.in/' },
                { name: 'CGPSC', url: 'https://psc.cg.gov.in/' },
                { name: 'High Court', url: 'https://highcourt.cg.gov.in/' },
                { name: 'CG Police', url: 'https://cgpolice.gov.in/' },
                { name: 'CG Forest', url: 'https://cgforest.gov.in/' },
                { name: 'NHM CG', url: 'https://www.nhmcg.in/' },
                { name: 'CSEB', url: 'https://cseb.gov.in/' }
            ];

            let allUpdates = [], allPdfs = [], hist = [];
            for (const site of sites) {
                const result = await scrapeWebsite(site);
                if (result.updates.length > 0) {
                    allUpdates = allUpdates.concat(result.updates);
                    hist.push({ time: new Date().toLocaleTimeString(), desc: `${site.name}: ${result.updates.length} update(s)`, type: 'scan' });
                }
                if (result.pdfs.length > 0) allPdfs = allPdfs.concat(result.pdfs);
            }

            updates = allUpdates.slice(0,20);
            pdfs = allPdfs.slice(0,10);
            history = hist.slice(0,10);
            history.unshift({ time: new Date().toLocaleTimeString(), desc: `✅ Scanned ${sites.length} sites, ${updates.length} updates`, type: 'scan' });

            lastScan.textContent = new Date().toLocaleTimeString();
            status.textContent = `✔ ${sites.length} Sites Checked`;
            render();
            showToast(`✅ ${updates.length} updates found`);

            isScanning = false;
            scanBtn.disabled = false;
            scanBtn.innerHTML = `<i class="fas fa-sync-alt"></i> Scan Now`;
        }

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        scanBtn.addEventListener('click', runScan);
        render();
    })();
</script>
</body>
</html>
